name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The point of the matrix is the OS. Windows and macOS differ from Linux in
    # path separators, text encoding and process handling, and every one of
    # those has bitten this tool.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      # No browser is launched: the mock backend covers everything except the
      # Ideogram page itself, and Playwright's own binaries are a slow download.
      - name: Test
        run: python -m pytest tests/ -q

      - name: Command works
        run: |
          imagegen --version
          imagegen spec > brief.md
          imagegen --help

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
