[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagegen-cli"
dynamic = ["version"]
description = "Universal, resumable batch image generation from a prompt folder or a JSON manifest"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Amir Ali", email = "sywmohammadamir@gmail.com" }]
keywords = ["image-generation", "batch", "cli", "ideogram", "playwright", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "playwright>=1.40",
    "pillow>=10",
    "numpy>=1.24",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only needed for --force-background-removal on images without a flat backdrop.
rembg = ["rembg>=2.0"]

[project.urls]
Homepage = "https://github.com/SyedAmirAli/imagegen"
Repository = "https://github.com/SyedAmirAli/imagegen"
Issues = "https://github.com/SyedAmirAli/imagegen/issues"

[project.scripts]
imagegen = "imagegen.cli:main"
imagegen-cli = "imagegen.cli:main"

[tool.hatch.version]
path = "imagegen/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["imagegen"]

# `imagegen spec` prints this brief. It lives at the repo root so GitHub renders
# it, and is copied into the package so an installed copy can still find it.
[tool.hatch.build.targets.wheel.force-include]
"AUTHORING.md" = "imagegen/AUTHORING.md"

[tool.hatch.build.targets.sdist]
include = ["imagegen/", "README.md", "AUTHORING.md", "LICENSE", "pyproject.toml"]
exclude = ["examples/", ".gitignore"]
